name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Noun separation (ratchet — fails if count grows)
        run: pnpm run check:nouns

      - name: Page style hex (ratchet — fails on novel files)
        run: pnpm run check:page-hex

      - name: Screen coverage (GAP-08)
        run: pnpm run check:screens

      - name: Go-live gate, slices, GAP-01–08
        run: node --import tsx --test apps/web/src/app/studio/golive-gate.test.ts apps/web/src/app/studio/live-facts.test.ts apps/web/src/app/studio/golive-confirm.test.ts apps/web/src/app/studio/hub-recession.test.ts apps/web/src/app/studio/menu-list-import.test.ts apps/web/src/app/studio/catalogue-lock.test.ts apps/web/src/app/studio/guest-entry-gate.test.ts apps/web/src/app/studio/venue-arrival.test.ts apps/web/src/app/studio/staff-paths.test.ts apps/web/src/app/studio/team-confidence.test.ts apps/web/src/app/studio/dead-pages.test.ts apps/web/src/app/studio/gap-01-08.test.ts

      - name: Runtime money / domain unit tests
        run: pnpm --filter @lekki/runtime-app test
