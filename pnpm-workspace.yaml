packages:
  - 'packages/*'
  - 'packages/runtime/*'
  - 'apps/*'
  - 'packs/*'
  - 'connectors/*'

shamefullyHoist: true
autoInstallPeers: true
confirmModulesPurge: false

allowBuilds:
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
